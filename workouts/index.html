<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rep Snacks</title>
  <meta name="theme-color" content="#0f3d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rep Snacks">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scroller" id="scroller">
  <header class="top">
    <h1>Rep Snacks</h1>
    <p id="next-reminder" class="muted"></p>
  </header>

  <main>
    <section id="view-now" class="view"></section>
    <section id="view-history" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>
  </div>

  <nav class="tabs">
    <button data-view="now" class="active">Now</button>
    <button data-view="history">History</button>
    <button data-view="settings">Settings</button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
