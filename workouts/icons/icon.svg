<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0f3d2e"/>
  <!-- clock ring -->
  <circle cx="256" cy="256" r="160" fill="#f3efe4"/>
  <circle cx="256" cy="256" r="136" fill="#0f3d2e"/>
  <!-- the quarter just elapsed, 12 to 3 -->
  <path d="M256 256 L256 120 A136 136 0 0 1 392 256 Z" fill="#c4502a"/>
  <!-- minute hand at :15 -->
  <rect x="243" y="243" width="122" height="26" rx="13" fill="#f3efe4"/>
  <!-- hour hand just past the hour -->
  <path d="M243.13 254.19 L253.29 181.9 A13 13 0 0 1 279.03 185.52 L268.87 257.81 Z" fill="#f3efe4"/>
  <circle cx="256" cy="256" r="22" fill="#f3efe4"/>
</svg>
